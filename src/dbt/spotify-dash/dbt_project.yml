name: 'spotify'
version: '1.0.0'
config-version: 2

# Profile to use from ~/.dbt/profiles.yml
profile: 'default'

# Modern dbt 1.x+ path definitions
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  spotify:
    materialized: view
